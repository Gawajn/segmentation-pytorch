[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pixel_classifier_torch"
version = "0.2.2.4"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    { name = "Alexander Hartelt", email = "alexander.hartelt@informatik.uni-wuerzburg.de" }
]
keywords = ["OCR", "page segmentation", "pixel classifier"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "License :: OSI Approved :: Apache Software License",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Image Recognition"
]
dependencies = [
    # Deep Learning & Computer Vision core
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "segmentation-models-pytorch>=0.3.0",
    "efficientnet-pytorch>=0.7.0",
    "ttach>=0.0.3",

    # Image Processing & Geometry
    "pillow>=9.0.0",
    "opencv-python-headless>=4.8.0",
    "scikit-image>=0.19.0",
    "albumentations>=1.3.0",
    "shapely>=1.8.0",

    # Layout Analysis & Document Processing
    "PageXML-to-Mask-converter",
    "doxapy",
    "ezodf>=0.3.0",
    "lxml>=4.9.0",

    # Data Science & Math
    "numpy>=1.21.0",
    "pandas>=1.5.0",
    "scipy>=1.8.0",
    "scikit-learn>=1.0.0",

    # Visualization
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",

    # Serialization & Data Modeling
    "mashumaro>=3.0",
    "dataclasses-json>=0.5.0",

    # Utilities
    "tqdm>=4.64.0",
    "loguru>=0.6.0",
    "future>=0.18.0",
    "setuptools>=61.0.0",
]

[project.urls]
Repository = "https://github.com/Gawajn/segmentation-pytorch"

[project.scripts]
pytorchseg_predict = "segmentation.scripts.predict:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# This mimics `packages=find_packages()` from setup.py
where = ["."]
include = ["*"]
exclude = []